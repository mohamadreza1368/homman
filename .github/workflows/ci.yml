name: Homman CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-and-build:
    name: Validate Data, Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Run educational policy & static checks
        run: npm run lint

      - name: Verify Python pipeline export reproducibility
        run: python pipeline/scripts/build_release_data.py --check

      - name: Validate medical JSON schema & unique AnatomyRecord mapping
        run: npm run validate:data

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm --prefix frontend run build
